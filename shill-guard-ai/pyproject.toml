[project]
name = "shill-guard-ai"
version = "0.1.0"
description = "ShillGuard AI agents (chat / writer / moderator) - LangGraph + FastAPI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.5",
    "langgraph>=0.2.50",
    "langchain-openai>=0.2",
    "langchain-core>=0.3",
    "python-dotenv>=1.0",
    "chromadb>=0.5",
    "langchain-chroma>=0.1",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "alibabacloud_green20220302>=3.2.4",
    "mem0ai>=0.1.0",
    "tiktoken>=0.7",
    "agent-memory-guard>=0.3.0",
    "aio-pika>=9.4",
    "redis>=5.0",
]

