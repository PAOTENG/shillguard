openapi: 3.0.3

info:
  title: ShillGuard API
  description: |
    ShillGuard 水军智能检测系统接口文档。
    
    ## 认证说明
    登录成功后获取 `token`，后续所有需要认证的接口请在请求头添加：
    ```
    Authorization: Bearer <token>
    ```
    网关会自动解析 token 并注入 `X-User-Id`、`X-User-Role` 头，微服务内部通过这两个头识别用户身份。
    
    ## 角色权限
    | role 值 | 说明 |
    |---------|------|
    | 0 | 普通用户 |
    | 1 | 版主 |
    | 2 | 管理员 |
    
    ## 统一响应格式
    所有接口均返回统一格式：
    ```json
    {
      "code": 200,
      "message": "操作成功",
      "data": {}
    }
    ```
  version: 1.0.0
  contact:
    name: ShillGuard Team

servers:
  - url: http://localhost:8080
    description: 本地开发环境（API 网关）
  - url: http://localhost:3001/api
    description: 前端代理（开发调试）

tags:
  - name: 认证
    description: 用户登录、注册、退出
  - name: 用户
    description: 用户信息管理
  - name: 帖子
    description: 帖子发布与管理
  - name: 评论
    description: 评论发表与管理
  - name: 文件
    description: 图片、视频、头像上传
  - name: Agent检测
    description: 水军检测与禁言管理（需管理员权限）

# ===================== 组件定义 =====================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 登录后获取的 JWT Token

  schemas:
    # 统一响应包装
    Result:
      type: object
      properties:
        code:
          type: integer
          description: 业务状态码
          example: 200
        message:
          type: string
          description: 响应消息
          example: 操作成功
        data:
          description: 响应数据（类型随接口不同而变化）

    ResultVoid:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              type: object
              nullable: true
              example: null

    # 分页结构
    PageInfo:
      type: object
      properties:
        records:
          type: array
          description: 数据列表
        total:
          type: integer
          format: int64
          description: 总记录数
          example: 128
        size:
          type: integer
          description: 每页大小
          example: 10
        current:
          type: integer
          description: 当前页码
          example: 1
        pages:
          type: integer
          description: 总页数
          example: 13

    # 登录请求
    LoginDTO:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          description: 用户名（登录账号）
          example: admin
        password:
          type: string
          description: 登录密码（明文，传输层加密）
          example: "123456"

    # 注册请求
    RegisterDTO:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 20
          description: 用户名，3-20位
          example: testuser
        password:
          type: string
          minLength: 6
          maxLength: 30
          description: 密码，6-30位
          example: "password123"
        nickname:
          type: string
          description: 昵称（可选）
          example: 测试用户
        phone:
          type: string
          description: 手机号（可选）
          example: "13800138000"
        email:
          type: string
          format: email
          description: 邮箱（可选）
          example: test@example.com

    # 登录响应
    LoginVO:
      type: object
      properties:
        userId:
          type: integer
          format: int64
          description: 用户ID
          example: 1001
        username:
          type: string
          description: 用户名
          example: admin
        nickname:
          type: string
          description: 昵称
          example: 管理员
        avatarUrl:
          type: string
          description: 头像URL
          example: "http://localhost:9000/shill-guard/avatars/abc.jpg"
        role:
          type: integer
          description: 角色（0=普通用户 1=版主 2=管理员）
          example: 2
        token:
          type: string
          description: JWT Token，后续请求放入 Authorization 头
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        expireIn:
          type: integer
          format: int64
          description: Token有效期（秒）
          example: 86400

    # 用户信息
    SysUser:
      type: object
      properties:
        userId:
          type: integer
          format: int64
          description: 用户ID
          example: 1001
        username:
          type: string
          description: 用户名
          example: admin
        nickname:
          type: string
          description: 昵称
          example: 管理员
        avatarUrl:
          type: string
          nullable: true
          description: 头像URL
          example: "http://localhost:9000/shill-guard/avatars/abc.jpg"
        role:
          type: integer
          description: 角色（0=普通用户 1=版主 2=管理员）
          example: 0
        status:
          type: integer
          description: 状态（0=正常 1=禁言 2=禁用）
          example: 0
        createdTime:
          type: string
          format: date-time
          description: 注册时间
          example: "2024-01-15T10:30:00"

    # 发布帖子请求
    PostCreateDTO:
      type: object
      required:
        - title
        - content
      properties:
        title:
          type: string
          description: 帖子标题（必填）
          example: 分享一个好用的摄影技巧
        content:
          type: string
          description: 帖子正文内容（必填）
          example: 今天分享一个超实用的构图技巧，三分法则...
        coverUrl:
          type: string
          nullable: true
          description: 封面图URL（由文件服务上传后获取）
          example: "http://localhost:9000/shill-guard/images/cover.jpg"
        mediaUrl:
          type: string
          nullable: true
          description: 媒体资源URL（视频/图组）
          example: "http://localhost:9000/shill-guard/videos/video.mp4"
        postType:
          type: integer
          description: 帖子类型（1=纯文字 2=图文 3=视频）
          enum: [1, 2, 3]
          example: 2
        topicTag:
          type: string
          nullable: true
          description: 话题标签
          example: 摄影

    # 帖子实体
    ContentPost:
      type: object
      properties:
        postId:
          type: integer
          format: int64
          description: 帖子ID
          example: 2001
        userId:
          type: integer
          format: int64
          description: 发布者用户ID
          example: 1001
        username:
          type: string
          description: 发布者用户名
          example: user01
        nickname:
          type: string
          description: 发布者昵称
          example: 摄影爱好者
        avatarUrl:
          type: string
          nullable: true
          description: 发布者头像URL
          example: "http://localhost:9000/shill-guard/avatars/a.jpg"
        title:
          type: string
          description: 帖子标题
          example: 分享一个好用的摄影技巧
        content:
          type: string
          description: 帖子内容
          example: 今天分享一个超实用的构图技巧...
        coverUrl:
          type: string
          nullable: true
          description: 封面图URL
          example: "http://localhost:9000/shill-guard/images/cover.jpg"
        mediaUrl:
          type: string
          nullable: true
          description: 媒体URL
        postType:
          type: integer
          description: 帖子类型（1=纯文字 2=图文 3=视频）
          example: 2
        topicTag:
          type: string
          nullable: true
          description: 话题标签
          example: 摄影
        viewCount:
          type: integer
          description: 浏览数
          example: 1024
        likeCount:
          type: integer
          description: 点赞数
          example: 88
        commentCount:
          type: integer
          description: 评论数
          example: 23
        isLiked:
          type: boolean
          description: 当前用户是否已点赞（需登录）
          example: false
        status:
          type: integer
          description: 状态（0=正常 1=删除）
          example: 0
        createdTime:
          type: string
          format: date-time
          description: 发布时间
          example: "2024-06-15T14:30:00"

    # 发表评论请求
    CommentCreateDTO:
      type: object
      required:
        - postId
        - content
      properties:
        postId:
          type: integer
          format: int64
          description: 所属帖子ID（必填）
          example: 2001
        content:
          type: string
          description: 评论内容（必填）
          example: 写得真好，学到了！
        parentCommentId:
          type: integer
          format: int64
          nullable: true
          description: 父评论ID（为null则为一级评论，有值则为回复）
          example: null
        replyToUserId:
          type: integer
          format: int64
          nullable: true
          description: 被回复用户ID（回复评论时填写）
          example: null

    # 评论实体
    ContentComment:
      type: object
      properties:
        commentId:
          type: integer
          format: int64
          description: 评论ID
          example: 3001
        userId:
          type: integer
          format: int64
          description: 评论者用户ID
          example: 1001
        username:
          type: string
          description: 评论者用户名
          example: user01
        nickname:
          type: string
          description: 评论者昵称
          example: 小红
        avatarUrl:
          type: string
          nullable: true
          description: 评论者头像
          example: "http://localhost:9000/shill-guard/avatars/a.jpg"
        postId:
          type: integer
          format: int64
          description: 所属帖子ID
          example: 2001
        parentCommentId:
          type: integer
          format: int64
          nullable: true
          description: 父评论ID（null=一级评论）
          example: null
        replyToUserId:
          type: integer
          format: int64
          nullable: true
          description: 被回复用户ID
          example: null
        content:
          type: string
          description: 评论内容
          example: 写得真好，学到了！
        likeCount:
          type: integer
          description: 点赞数
          example: 5
        status:
          type: integer
          description: 状态（0=正常 1=删除）
          example: 0
        createdTime:
          type: string
          format: date-time
          description: 评论时间
          example: "2024-06-15T15:00:00"

    # 禁言记录实体
    AgentMuteRecord:
      type: object
      properties:
        muteId:
          type: integer
          format: int64
          description: 禁言记录ID
          example: 4001
        mutedUserId:
          type: integer
          format: int64
          description: 被禁言用户ID
          example: 1005
        reporterUserId:
          type: integer
          format: int64
          nullable: true
          description: 举报人用户ID（可为空）
          example: null
        reviewerUserId:
          type: integer
          format: int64
          nullable: true
          description: 审核人ID（人工操作时有值）
          example: 1001
        relatedCommentId:
          type: integer
          format: int64
          nullable: true
          description: 关联违规评论ID
          example: 3005
        muteReason:
          type: string
          description: 禁言原因
          example: 系统检测到该用户属于水军群组，协同刷评论
        muteDays:
          type: integer
          description: 禁言天数
          example: 7
        muteType:
          type: integer
          description: 禁言类型（0=Agent自动 1=人工）
          enum: [0, 1]
          example: 0
        status:
          type: integer
          description: 状态（1=禁言中 0=已解除）
          enum: [0, 1]
          example: 1
        createdTime:
          type: string
          format: date-time
          description: 创建时间
          example: "2024-06-15T16:00:00"
        expireTime:
          type: string
          format: date-time
          nullable: true
          description: 解除时间
          example: "2024-06-22T16:00:00"

    # 错误响应
    ErrorResult:
      type: object
      properties:
        code:
          type: integer
          description: 错误码
          example: 401
        message:
          type: string
          description: 错误描述
          example: 未登录或Token已过期
        data:
          type: object
          nullable: true
          example: null

# ===================== 接口定义 =====================
paths:

  # ==================== 认证模块 ====================
  /api/auth/login:
    post:
      tags: [认证]
      summary: 用户登录
      description: |
        使用用户名和密码登录，成功后返回 JWT Token。
        Token 需存储在本地，后续请求通过 `Authorization: Bearer <token>` 携带。
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDTO'
            examples:
              普通用户登录:
                value:
                  username: "testuser"
                  password: "123456"
              管理员登录:
                value:
                  username: "admin"
                  password: "admin123"
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginVO'
              example:
                code: 200
                message: 操作成功
                data:
                  userId: 1001
                  username: "testuser"
                  nickname: "测试用户"
                  avatarUrl: "http://localhost:9000/shill-guard/avatars/a.jpg"
                  role: 0
                  token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOjEwMDEsInJvbGUiOjB9.xxx"
                  expireIn: 86400
        '400':
          description: 参数错误或密码错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              examples:
                密码错误:
                  value:
                    code: 1003
                    message: 密码错误
                    data: null
                用户不存在:
                  value:
                    code: 1001
                    message: 用户不存在
                    data: null
                账号被禁言:
                  value:
                    code: 1004
                    message: 账号已被禁言
                    data: null

  /api/auth/register:
    post:
      tags: [认证]
      summary: 用户注册
      description: 注册新账号，用户名唯一，密码6-30位，注册后需重新登录获取Token。
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDTO'
            example:
              username: "newuser"
              password: "password123"
              nickname: "新用户"
              phone: "13800138000"
              email: "new@example.com"
      responses:
        '200':
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
              example:
                code: 200
                message: 操作成功
                data: null
        '400':
          description: 参数错误或用户名已存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              examples:
                用户名已存在:
                  value:
                    code: 1002
                    message: 用户名已存在
                    data: null
                参数校验失败:
                  value:
                    code: 422
                    message: 用户名长度3-20位
                    data: null

  /api/auth/logout:
    post:
      tags: [认证]
      summary: 退出登录
      description: 使当前用户的 Token 失效（服务端删除 Redis 中的 Token）。
      operationId: logout
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 退出成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
              example:
                code: 200
                message: 操作成功
                data: null
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                code: 401
                message: 未登录或Token已过期
                data: null

  # ==================== 用户模块 ====================
  /api/user/me:
    get:
      tags: [用户]
      summary: 获取当前登录用户信息
      description: 返回当前登录用户的完整信息（含手机号、邮箱等敏感字段）。
      operationId: getCurrentUser
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SysUser'
              example:
                code: 200
                message: 操作成功
                data:
                  userId: 1001
                  username: "testuser"
                  nickname: "测试用户"
                  avatarUrl: "http://localhost:9000/shill-guard/avatars/a.jpg"
                  role: 0
                  status: 0
                  createdTime: "2024-01-15T10:30:00"

    put:
      tags: [用户]
      summary: 修改个人昵称或头像
      description: |
        修改当前用户的昵称或头像URL，两个参数均为可选，传哪个改哪个。
        头像URL 需先通过 `/api/file/avatar` 接口上传获取。
      operationId: updateCurrentUser
      security:
        - BearerAuth: []
      parameters:
        - name: nickname
          in: query
          required: false
          description: 新昵称
          schema:
            type: string
            example: 新昵称
        - name: avatarUrl
          in: query
          required: false
          description: 新头像URL（由文件服务上传获取）
          schema:
            type: string
            example: "http://localhost:9000/shill-guard/avatars/new.jpg"
      responses:
        '200':
          description: 修改成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
              example:
                code: 200
                message: 操作成功
                data: null

  /api/user/{userId}:
    get:
      tags: [用户]
      summary: 获取指定用户公开信息
      description: 返回用户的公开信息（仅含userId、nickname、avatarUrl、role），敏感字段不返回。
      operationId: getUserProfile
      parameters:
        - name: userId
          in: path
          required: true
          description: 用户ID
          schema:
            type: integer
            format: int64
            example: 1001
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          userId:
                            type: integer
                            format: int64
                            example: 1001
                          nickname:
                            type: string
                            example: 测试用户
                          avatarUrl:
                            type: string
                            example: "http://localhost:9000/shill-guard/avatars/a.jpg"
                          role:
                            type: integer
                            example: 0
              example:
                code: 200
                message: 操作成功
                data:
                  userId: 1001
                  nickname: "测试用户"
                  avatarUrl: "http://localhost:9000/shill-guard/avatars/a.jpg"
                  role: 0
        '404':
          description: 用户不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                code: 1001
                message: 用户不存在
                data: null

  /api/user/{userId}/mute:
    put:
      tags: [用户]
      summary: 管理员直接禁言用户（改状态）
      description: |
        管理员将用户状态设为禁言（status=1）。
        **需要 role >= 2 的管理员权限。**
        注意：此接口仅修改用户状态，完整的禁言记录请使用 `/api/agent/mute` 接口。
      operationId: muteUser
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          description: 要禁言的用户ID
          schema:
            type: integer
            format: int64
            example: 1005
      responses:
        '200':
          description: 禁言成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
              example:
                code: 200
                message: 操作成功
                data: null
        '403':
          description: 无权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                code: 403
                message: 无权限访问
                data: null

  # ==================== 帖子模块 ====================
  /api/content/posts:
    get:
      tags: [帖子]
      summary: 获取帖子列表（分页）
      description: |
        获取帖子列表，支持按话题标签筛选，按发布时间倒序排列。
        无需登录即可访问。
      operationId: getPostList
      parameters:
        - name: pageNum
          in: query
          required: false
          description: 页码（从1开始）
          schema:
            type: integer
            default: 1
            example: 1
        - name: pageSize
          in: query
          required: false
          description: 每页数量（最大50）
          schema:
            type: integer
            default: 10
            example: 20
        - name: topicTag
          in: query
          required: false
          description: 话题标签筛选（精确匹配）
          schema:
            type: string
            example: 摄影
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageInfo'
                          - type: object
                            properties:
                              records:
                                type: array
                                items:
                                  $ref: '#/components/schemas/ContentPost'
              example:
                code: 200
                message: 操作成功
                data:
                  records:
                    - postId: 2001
                      userId: 1001
