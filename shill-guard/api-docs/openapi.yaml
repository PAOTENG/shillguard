  # ==================== 文件模块 ====================
  /api/file/image:
    post:
      tags: [文件]
      summary: 上传图片
      description: |
        上传图片到 MinIO，返回可访问的图片URL。
        - 支持格式：JPEG、PNG、GIF、WebP
        - 最大大小：10MB
        - 上传成功后将URL填入帖子的 `coverUrl` 字段
      operationId: uploadImage
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 图片文件（JPEG/PNG/GIF/WebP，最大10MB）
      responses:
        '200':
          description: 上传成功，返回图片URL
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: string
                        description: 可直接访问的图片URL
              example:
                code: 200
                message: 操作成功
                data: "http://localhost:9000/shill-guard/images/3f4a9c2b-1234-5678-abcd.jpg"
        '400':
          description: 文件类型不支持或超出大小限制
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              examples:
                类型不支持:
                  value:
                    code: 3002
                    message: 不支持的文件类型
                    data: null
                文件过大:
                  value:
                    code: 3003
                    message: 文件大小超出限制
                    data: null

  /api/file/video:
    post:
      tags: [文件]
      summary: 上传视频
      description: |
        上传视频到 MinIO，返回可访问的视频URL。
        - 支持格式：MP4、MOV、AVI
        - 最大大小：200MB
      operationId: uploadVideo
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 视频文件（MP4/MOV/AVI，最大200MB）
      responses:
        '200':
          description: 上传成功，返回视频URL
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: string
                        description: 可直接访问的视频URL
              example:
                code: 200
                message: 操作成功
                data: "http://localhost:9000/shill-guard/videos/7e8b3c1d-abcd-efgh.mp4"

  /api/file/avatar:
