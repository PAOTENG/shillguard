  # ==================== Agent检测模块 ====================
  /api/agent/detect/trigger:
    post:
      tags: [Agent检测]
      summary: 手动触发水军检测
      description: |
        通知 Python Agent 服务立即对当前平台的评论数据进行水军群组分析。
        - **需要管理员权限（role >= 2）**
        - 任务异步执行，接口立即返回；检测结果将自动写入禁言记录
        - 内部通过 RabbitMQ 发送检测指令，若消息队列不可用则降级为 HTTP 直调
      operationId: triggerDetect
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 检测任务已提交
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: string
                        description: 提交结果描述
              example:
                code: 200
                message: 操作成功
                data: "检测任务已提交"
        '403':
          description: 无管理员权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
              example:
                code: 403
                message: 无权限访问
                data: null

  /api/agent/mute/records:
    get:
      tags: [Agent检测]
      summary: 查询禁言记录列表（分页）
      description: |
        分页查询所有禁言记录，按创建时间倒序排列。
        **需要版主及以上权限（role >= 1）。**
      operationId: getMuteRecords
      security:
        - BearerAuth: []
      parameters:
        - name: pageNum
          in: query
          required: false
          description: 页码
          schema:
            type: integer
            default: 1
            example: 1
        - name: pageSize
          in: query
          required: false
          description: 每页数量
          schema:
            type: integer
            default: 10
            example: 10
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageInfo'
                          - type: object
                            properties:
                              records:
                                type: array
                                items:
                                  $ref: '#/components/schemas/AgentMuteRecord'
              example:
                code: 200
                message: 操作成功
                data:
                  records:
                    - muteId: 4001
                      mutedUserId: 1005
                      muteReason: "系统检测到该用户属于水军群组，协同刷评论"
                      muteDays: 7
                      muteType: 0
                      status: 1
                      createdTime: "2024-06-15T16:00:00"
                  total: 42
                  size: 10
                  current: 1

  /api/agent/mute:
    post:
      tags: [Agent检测]
      summary: 手动执行禁言
      description: |
        管理员手动对指定用户执行禁言操作，同时创建禁言记录。
        **需要版主及以上权限（role >= 1）。**
      operationId: manualMute
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: query
          required: true
          description: 要禁言的用户ID
          schema:
            type: integer
            format: int64
            example: 1005
        - name: reason
          in: query
          required: true
          description: 禁言原因
          schema:
            type: string
            example: "多次发布虚假营销评论"
        - name: days
          in: query
          required: false
          description: 禁言天数（默认7天）
          schema:
            type: integer
            default: 7
            example: 30
      responses:
        '200':
          description: 禁言成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
              example:
                code: 200
                message: 操作成功
                data: null
        '403':
          description: 无权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'

  /api/agent/mute/{muteId}:
    delete:
      tags: [Agent检测]
      summary: 解除禁言
      description: |
        解除指定禁言记录，将禁言状态改为已解除，并恢复用户正常状态。
        **需要版主及以上权限（role >= 1）。**
      operationId: unmute
      security:
        - BearerAuth: []
      parameters:
        - name: muteId
          in: path
          required: true
          description: 禁言记录ID
          schema:
            type: integer
            format: int64
            example: 4001
      responses:
        '200':
          description: 解除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
              example:
                code: 200
                message: 操作成功
                data: null
        '403':
          description: 无权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
